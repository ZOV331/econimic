plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.game.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.game.app"
        minSdk 24
        targetSdk 34
        // Номер версии подставляет сборка на GitHub (номер запуска). Локально — 1.
        versionCode((project.findProperty("vc") ?: "1").toString().toInteger())
        versionName "1." + (project.findProperty("vc") ?: "1").toString()
    }

    // Постоянный ключ подписи: обновления ставятся поверх старой версии.
    // Не публикуйте этот файл и пароль (держите репозиторий приватным).
    signingConfigs {
        release {
            // Ключ подписи НЕ хранится в репозитории: сборка на GitHub берёт его из секретов
            // (Settings → Secrets → Actions: ROVARI_KEYSTORE и ROVARI_KEY_PASS).
            storeFile file('rovari.keystore')
            storePassword System.getenv('ROVARI_KEY_PASS') ?: ''
            keyAlias 'rovari'
            keyPassword System.getenv('ROVARI_KEY_PASS') ?: ''
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            // Защита кода: R8 сжимает и запутывает классы (имена превращаются в a, b, c…),
            // убирает лишнее — APK меньше, а разобрать и изменить его намного сложнее.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
