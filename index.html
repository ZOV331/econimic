<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROVARI">
<meta name="theme-color" content="#07080C">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ROVARI</title>
<style>
html,body{margin:0;height:100%;background:#07080C;color:#fff;font-family:-apple-system,Roboto,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07080C}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#4F80FF,#2B5CFF);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px}
.m{color:#8C95AB;font-size:15px}
button{background:linear-gradient(135deg,#4F80FF,#2B5CFF);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div id="msg"><div class="logo">Э</div><div class="m" id="t">Подключение к серверу…</div></div>
<script>
// Адрес сервера берётся из server.txt (его меняет владелец, когда меняется туннель).
async function go(){
  try {
    const r = await fetch("server.txt?t=" + Date.now(), {cache: "no-store"});
    const url = (await r.text()).trim().split(/\s+/)[0].replace(/\/+$/, "");
    if (!/^https?:\/\//.test(url)) throw 0;
    const f = document.createElement("iframe");
    f.src = url + "/";
    f.allow = "clipboard-write";
    document.body.appendChild(f);
    setTimeout(() => document.getElementById("msg").remove(), 1500);
  } catch(e) {
    document.getElementById("t").textContent = "Не удалось узнать адрес сервера.";
    const b = document.createElement("button"); b.textContent = "Повторить"; b.onclick = () => location.reload();
    document.getElementById("msg").appendChild(b);
  }
}
go();
</script>
</body>
</html>
