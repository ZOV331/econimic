name: Собрать APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Восстановить ключ подписи
        env:
          ROVARI_KEYSTORE: ${{ secrets.ROVARI_KEYSTORE }}
        run: echo "$ROVARI_KEYSTORE" | base64 -d > app/rovari.keystore

      - name: Сборка
        env:
          ROVARI_KEY_PASS: ${{ secrets.ROVARI_KEY_PASS }}
        run: |
          for i in 1 2 3; do
            gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} && exit 0
            echo "Попытка $i не удалась. Жду 45 секунд (частая причина — 429 Too Many Requests от Maven Central)..."
            sleep 45
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Ekonomika-apk
          path: app/build/outputs/apk/release/*.apk
